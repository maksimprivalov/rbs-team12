version: "3.9"

services:
  server:
    build: ./server
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    environment:
      - DATABASE_URL=sqlite:///./oblak.db
      - SECRET_KEY=dev-secret-change-in-prod
      - STORAGE_PATH=/app/storage
    depends_on: []
    restart: unless-stopped

