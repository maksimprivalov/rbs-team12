[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "oblak"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer==0.12.3",
    "httpx==0.27.0",
    "rich==13.7.1",
]

[project.scripts]
oblak = "oblak.main:app"

[tool.setuptools.packages.find]
where = ["."]
